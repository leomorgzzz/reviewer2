# Corre pruebas/correr.py en cada push a main y antes de compilar una versión
# (Ejecutables la llama: si falla, no se publica nada).
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 pruebas/correr.py
