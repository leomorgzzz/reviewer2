name: Science content / Contenido científico
description: A value, structure, explanation or translation that is wrong or unclear.
labels: [contenido]
body:
  - type: textarea
    id: donde
    attributes:
      label: Where? / ¿Dónde?
      description: Case, station, Reviewer 2 comment, method or manual section.
    validations:
      required: true
  - type: textarea
    id: correccion
    attributes:
      label: What's wrong and what should it say? / ¿Qué está mal y qué debería decir?
      description: A source (textbook, paper, database) helps a lot.
    validations:
      required: true
